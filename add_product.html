<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Produk</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* loading aman (tidak ganggu layout) */
        #loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        #loading .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #fff;
            border-top: 5px solid #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

<!-- LOADING (TAMBAHAN SAJA, AMAN) -->
<div id="loading">
    <div class="spinner"></div>
</div>

<div class="container">

    <div class="card form-card">
        <h2>➕ Tambah Produk</h2>
        <p class="subtitle">Isi data produk dengan benar</p>

        <input type="text" id="nama" placeholder="Nama Produk">
        <input type="number" id="harga" placeholder="Harga Produk">

        <button onclick="saveProduct()">Simpan</button>

        <p id="message"></p>

        <div class="switch">
            <a href="products.html">← Kembali ke daftar produk</a>
        </div>
    </div>

</div>

<script src="js/add_product.js"></script>

</body>
</html>
