<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Produk</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f6fa;
        }

        .container {
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .subtitle {
            margin: 0;
            font-size: 14px;
            color: #666;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .primary {
            background: #4CAF50;
            color: white;
        }

        .danger {
            background: #e74c3c;
            color: white;
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* TABLE STYLE */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f1f1f1;
        }

        tr:hover {
            background: #fafafa;
        }

        .action-btn {
            padding: 6px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        .edit {
            background: #3498db;
            color: white;
        }

        .delete {
            background: #e74c3c;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div>
            <h2>📦 Daftar Produk</h2>
            <p class="subtitle">Kelola produk kamu dengan mudah</p>
        </div>

        <div class="actions">
            <button class="btn primary" onclick="window.location='add_product.html'">
                + Tambah Produk
            </button>

            <button class="btn danger" onclick="logout()">
                Logout
            </button>
        </div>
    </div>

    <!-- TABLE -->
    <table>
        <thead>
            <tr>
                <th>No</th>
                <th>Nama Produk</th>
                <th>Harga</th>
           
            </tr>
        </thead>

        <tbody id="productList">
            <!-- data JS masuk sini -->
        </tbody>
    </table>

</div>

<script src="js/product.js"></script>
</body>
</html>
